<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>당과당 레시피 LAB</title>
<style>
:root{--green:#4f8056;--green2:#e7f0e4;--yellow:#f2d76b;--ink:#233329;--muted:#78877b;--line:#dce6da;--paper:#f7faf5;--white:#fff;--danger:#a44738}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);padding:9px 12px}button.primary{background:var(--green);color:white;border-color:var(--green)}button.soft{background:var(--green2);border-color:var(--green2)}button.danger{color:var(--danger)}header{height:66px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:2}.brand{display:flex;align-items:center;gap:11px}.mark{background:var(--green);color:var(--yellow);font-weight:900;border-radius:12px;padding:8px 12px;font-size:22px}.brand strong{display:block}.brand small{color:var(--muted);font-size:10px;letter-spacing:1px}.actions{display:flex;gap:8px}.layout{display:grid;grid-template-columns:225px minmax(0,1fr);min-height:calc(100vh - 66px)}aside{padding:22px 14px;border-right:1px solid var(--line);background:#f0f5ed}.nav{display:flex;flex-direction:column;gap:7px}.nav button{text-align:left;background:transparent;border-color:transparent;color:#5f7363}.nav button.active{background:#dfeadb;color:#244d30;font-weight:700}.tip{margin:24px 5px;padding:14px;border:1px dashed #c3d6bf;border-radius:12px;color:#617463;font-size:12px;line-height:1.6}main{padding:28px;max-width:1500px;width:100%;margin:auto}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--green);font-weight:800}.pagehead{display:flex;justify-content:space-between;align-items:end;margin:8px 0 22px;gap:16px}.pagehead h1{font-size:30px;font-weight:600;margin:6px 0}.muted{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px;min-width:0}.field label{font-size:12px;color:#657568}.field input,.field select,.field textarea,input.inline{border:1px solid var(--line);background:white;border-radius:9px;padding:10px 11px;width:100%;min-width:0;color:var(--ink)}textarea{resize:vertical;min-height:75px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:13px}.recipe-card,.panel,.stat{background:white;border:1px solid var(--line);border-radius:14px;padding:17px}.recipe-card{cursor:pointer;min-height:158px;display:flex;flex-direction:column;gap:10px}.recipe-card:hover,.recipe-card.selected{border:2px solid var(--green);padding:16px}.tag{display:inline-flex;background:var(--green2);color:#386440;border-radius:6px;padding:4px 7px;font-size:10px;margin-right:4px}.tag.test{background:#fff1ce;color:#846525}.recipe-card h3{margin:0;font-size:18px}.recipe-card p{margin:0;color:#6f7d71;font-size:12px;line-height:1.6}.cardfoot{border-top:1px solid #edf1eb;margin-top:auto;padding-top:10px;color:#879388;font-size:10px}.columns{display:grid;grid-template-columns:minmax(240px,290px) minmax(0,1fr);gap:18px;align-items:start}.detail-head{padding:3px 0 15px;border-bottom:1px solid var(--line);margin-bottom:16px}.detail-head h2{font-size:25px;margin:8px 0}.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:10px 0 16px}.tabs button{border:0;border-radius:0;background:transparent;padding:10px 0;color:#718073}.tabs button.active{border-bottom:2px solid var(--green);color:#285334;font-weight:700}.panel{margin-bottom:14px}.panel h3{font-size:14px;margin:0 0 14px}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border-bottom:1px solid #edf1eb;text-align:left;padding:10px 8px;white-space:nowrap}th{color:#829083;font-weight:500;background:#fafcf9}td input{width:100px;padding:7px;border:1px solid var(--line);border-radius:7px}.qty{font-weight:700;color:#235b38}.scale{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.scale strong{min-width:26px;text-align:center}.steps{display:flex;flex-direction:column;gap:8px}.step{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;padding:11px;background:#f7faf6;border-radius:10px}.num{background:#e2eddf;color:#35613c;border-radius:8px;text-align:center;padding:5px;font-size:12px}.step textarea{min-height:55px}.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.statrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:25px;margin-top:5px}.prodrow{display:grid;grid-template-columns:minmax(0,1fr) 90px 70px;gap:10px;align-items:center;border-bottom:1px solid #edf1eb;padding:10px 0}.prodrow input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px}.ingredientgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}.ingredient{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fff}.ingredient h4{margin:0 0 8px}.ingredient .row{display:flex;gap:8px}.ingredient .row .field{flex:1}.footnote{font-size:11px;color:var(--muted);line-height:1.6}.hidden{display:none!important}
@media(max-width:800px){.layout{grid-template-columns:1fr}aside{padding:8px 12px;border-right:0;border-bottom:1px solid var(--line)}.nav{flex-direction:row;overflow:auto}.nav button{white-space:nowrap;padding:8px}.tip{display:none}main{padding:18px 13px}.columns{grid-template-columns:1fr}.pagehead h1{font-size:24px}.statrow{grid-template-columns:1fr 1fr}.statrow .stat:last-child{display:none}header{padding:0 12px}.actions button:first-child{display:none}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js" defer></script>
</head>
<body>
<header><div class="brand"><div class="mark">당</div><div><strong>당과당 레시피</strong><small>RECIPE LAB · 생산관리</small></div></div><div class="actions"><button onclick="showPage('production')">오늘 생산</button><button class="primary" onclick="newRecipe()">＋ 새 레시피</button></div></header>
<div class="layout"><aside><div class="nav"><button class="active" data-page="recipes" onclick="showPage('recipes')">▦　레시피</button><button data-page="production" onclick="showPage('production')">◷　오늘 생산</button><button data-page="ingredients" onclick="showPage('ingredients')">◇　재료 관리</button></div><div class="tip"><b>TIP</b><br>레시피를 완성한 뒤 테스트 기록을 남겨보세요.<br>입력한 자료는 이 브라우저에 자동 저장됩니다.</div></aside><main id="main"></main></div>
<script>
const STORE='dangwadang_recipe_lab_v1';
let state=load(), page='recipes', selected=null, tab='recipe', multiplier=1, draft=null;
window.__dangwadangSyncGetState=()=>state;
window.__dangwadangSyncSetState=(next)=>{state=next;};
function load(){try{return JSON.parse(localStorage.getItem(STORE))||{recipes:[],ingredients:[]}}catch(e){return{recipes:[],ingredients:[]}}}
function save(){localStorage.setItem(STORE,JSON.stringify(state));}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return Math.random().toString(36).slice(2,10)}
function fmt(n){return Number(n.toFixed(3)).toString()}
function showPage(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
function newRecipe(){draft={id:uid(),name:'',category:'빵',status:'테스트',baseYield:1,description:'',memo:'',ingredients:[],steps:[],tests:[],updated:new Date().toISOString().slice(0,10)};selected=draft.id;tab='recipe';multiplier=1;page='recipes';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));render()}
function getRecipe(){return draft&&draft.id===selected?draft:state.recipes.find(r=>r.id===selected)}
function setCurrent(r){if(draft&&draft.id===r.id)draft=r;else{let i=state.recipes.findIndex(x=>x.id===r.id);if(i>=0)state.recipes[i]=r}save()}
function render(){if(page==='recipes')renderRecipes();if(page==='production')renderProduction();if(page==='ingredients')renderIngredients()}
function renderRecipes(){const r=getRecipe();document.getElementById('main').innerHTML=`
<div class="eyebrow">DANGWADANG · RECIPE LAB</div><div class="pagehead"><div><h1>레시피 작업실</h1><div class="muted">배합량, 공정, 테스트 기록을 한곳에서 관리해요.</div></div><div style="text-align:right"><strong style="font-size:26px">${state.recipes.length+(draft?1:0)}</strong><div class="muted">등록 레시피</div></div></div>
<div class="toolbar"><input class="inline" id="search" placeholder="⌕ 레시피·재료 검색" style="max-width:300px" oninput="filterCards(this.value)"><select id="categoryFilter" onchange="filterCards(document.getElementById('search').value)"><option value="">전체 분류</option><option>빵</option><option>구움과자</option><option>찹쌀떡</option><option>케이크</option><option>음료</option><option>기타</option></select><button class="primary" onclick="newRecipe()">＋ 새 레시피</button></div>
<div class="columns"><div><div class="muted" style="margin-bottom:8px">레시피 목록 · ${state.recipes.length+(draft?1:0)}</div><div class="grid" id="cards" style="grid-template-columns:1fr">${cardHtml()}</div></div><section id="detail">${r?detailHtml(r):'<div class="empty">레시피를 선택하거나<br>새 레시피를 등록해 주세요.</div>'}</section></div>`; }
function cardHtml(){let list=[...state.recipes];if(draft&&!list.some(x=>x.id===draft.id))list.unshift(draft);return list.map(r=>`<div class="recipe-card ${selected===r.id?'selected':''}" data-text="${esc((r.name+' '+r.category+' '+r.ingredients.map(i=>i.name).join(' ')).toLowerCase())}" onclick="selectRecipe('${r.id}')"><div><span class="tag">${esc(r.category)}</span><span class="tag ${r.status==='테스트'?'test':''}">${esc(r.status)}</span></div><h3>${esc(r.name||'새 레시피')}</h3><p>${esc(r.description||'레시피 설명을 입력해 주세요.')}</p><div class="cardfoot">${r.baseYield||1}개 기준 · ${esc(r.updated||'미저장')}</div></div>`).join('')||'<div class="empty">아직 등록된 레시피가 없어요.</div>'}
function filterCards(q){const cat=document.getElementById('categoryFilter').value.toLowerCase();document.querySelectorAll('.recipe-card').forEach(card=>{const text=card.dataset.text||'';const matchesText=text.includes((q||'').toLowerCase());const matchesCategory=!cat||text.includes(cat);card.classList.toggle('hidden',!(matchesText&&matchesCategory));});}
function selectRecipe(id){if(draft&&draft.id!==id){draft=null}selected=id;multiplier=1;render()}
function detailHtml(r){return `<div class="detail-head"><div><span class="tag">${esc(r.category)}</span><span class="tag ${r.status==='테스트'?'test':''}">${esc(r.status)}</span></div><h2>${esc(r.name||'새 레시피')}</h2><div class="muted">마지막 수정 ${esc(r.updated||'미저장')}</div><div class="tabs"><button class="${tab==='recipe'?'active':''}" onclick="tab='recipe';render()">레시피</button><button class="${tab==='steps'?'active':''}" onclick="tab='steps';render()">공정</button><button class="${tab==='tests'?'active':''}" onclick="tab='tests';render()">테스트 ${r.tests.length}</button></div></div>
${tab==='recipe'?recipeTab(r):tab==='steps'?stepsTab(r):testsTab(r)}`}
function recipeTab(r){return `<div class="panel"><div class="panelhead"><div><b>배합량 계산</b><div class="muted">기준 ${r.baseYield||1}개</div></div><div class="scale"><button onclick="changeMultiplier(-1)">−</button><strong>${multiplier}×</strong><button onclick="changeMultiplier(1)">＋</button><b>→ ${(r.baseYield||1)*multiplier}개</b></div></div></div>
<div class="panel"><div class="panelhead"><h3>재료 <span class="muted">자동 계산</span></h3><button onclick="addIngredientRow()">＋ 재료 추가</button></div><div class="tablewrap"><table><thead><tr><th>재료명</th><th>기준량</th><th>현재량</th><th>단위</th><th></th></tr></thead><tbody>${r.ingredients.map((i,n)=>`<tr><td><input value="${esc(i.name)}" onchange="editIng(${n},'name',this.value)" placeholder="재료명"></td><td><input type="number" min="0" step="any" value="${i.qty}" onchange="editIng(${n},'qty',this.value)"></td><td class="qty">${fmt((Number(i.qty)||0)*multiplier)}</td><td><input style="width:60px" value="${esc(i.unit||'g')}" onchange="editIng(${n},'unit',this.value)"></td><td><button class="danger" onclick="removeIng(${n})">삭제</button></td></tr>`).join('')}</tbody></table></div></div>
<div class="panel"><h3>레시피 정보</h3><div class="field"><label>레시피 이름</label><input value="${esc(r.name)}" onchange="editRecipe('name',this.value)" placeholder="예: 소금빵"></div><div class="row" style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="field"><label>분류</label><select onchange="editRecipe('category',this.value)">${['빵','구움과자','찹쌀떡','케이크','음료','기타'].map(c=>`<option ${r.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>상태</label><select onchange="editRecipe('status',this.value)"><option ${r.status==='테스트'?'selected':''}>테스트</option><option ${r.status==='판매중'?'selected':''}>판매중</option><option ${r.status==='보류'?'selected':''}>보류</option></select></div></div><div class="field"><label>기준 생산 개수</label><input type="number" min="1" value="${r.baseYield||1}" onchange="editRecipe('baseYield',this.value)"></div><div class="field"><label>설명</label><textarea onchange="editRecipe('description',this.value)" placeholder="이 레시피의 특징">${esc(r.description)}</textarea></div><div class="field"><label>레시피 메모</label><textarea onchange="editRecipe('memo',this.value)" placeholder="중요한 포인트와 주의사항">${esc(r.memo)}</textarea></div><div class="toolbar"><button class="primary" onclick="saveRecipe()">저장하기</button><button onclick="exportData()">백업 내보내기</button><button class="danger" onclick="deleteRecipe()">레시피 삭제</button></div></div>`}
function stepsTab(r){return `<div class="panel"><div class="panelhead"><h3>제조 공정</h3><button onclick="addStep()">＋ 공정 추가</button></div><div class="steps">${r.steps.map((s,i)=>`<div class="step"><div class="num">${i+1}</div><textarea onchange="editStep(${i},this.value)" placeholder="공정 내용을 입력하세요">${esc(s)}</textarea><button class="danger" onclick="removeStep(${i})">삭제</button></div>`).join('')||'<div class="empty">제조 공정을 순서대로 추가해 주세요.</div>'}</div><div class="toolbar" style="margin-top:14px"><button class="primary" onclick="saveRecipe()">공정 저장</button></div></div>`}
function testsTab(r){return `<div class="panel"><div class="panelhead"><h3>테스트 기록</h3><button class="primary" onclick="addTest()">＋ 테스트 기록</button></div>${r.tests.map((t,i)=>`<div style="padding:13px 0;border-bottom:1px solid var(--line)"><div class="panelhead"><b>${esc(t.date)}</b><button class="danger" onclick="removeTest(${i})">삭제</button></div><div class="muted">배합 / 조건</div><p>${esc(t.condition||'내용 없음')}</p><div class="muted">결과 / 다음 테스트</div><p style="white-space:pre-wrap">${esc(t.result||'내용 없음')}</p></div>`).join('')||'<div class="empty">테스트 결과를 남기면 다음 배합에 도움이 돼요.</div>'}</div>`}
function editRecipe(k,v){let r=getRecipe();if(!r)return;r[k]=k==='baseYield'?Math.max(1,Number(v)||1):v;r.updated=new Date().toISOString().slice(0,10);setCurrent(r);if(k==='name')document.querySelector('.detail-head h2').textContent=v}
function editIng(i,k,v){let r=getRecipe();if(!r)return;r.ingredients[i][k]=k==='qty'?Math.max(0,Number(v)||0):v;setCurrent(r);render()}
function addIngredientRow(){let r=getRecipe();if(!r)return;r.ingredients.push({name:'',qty:0,unit:'g'});setCurrent(r);render()}
function removeIng(i){let r=getRecipe();r.ingredients.splice(i,1);setCurrent(r);render()}
function changeMultiplier(n){multiplier=Math.max(1,multiplier+n);render()}
function editStep(i,v){let r=getRecipe();r.steps[i]=v;setCurrent(r)}
function addStep(){let r=getRecipe();r.steps.push('');setCurrent(r);render()}
function removeStep(i){let r=getRecipe();r.steps.splice(i,1);setCurrent(r);render()}
function addTest(){let r=getRecipe();let date=prompt('테스트 날짜 (예: 2026-10-27)',new Date().toISOString().slice(0,10));if(date===null)return;let condition=prompt('배합과 테스트 조건을 입력해 주세요.','');if(condition===null)return;let result=prompt('결과와 다음 테스트 계획을 입력해 주세요.','');if(result===null)return;r.tests.unshift({date,condition,result});r.updated=new Date().toISOString().slice(0,10);setCurrent(r);render()}
function removeTest(i){let r=getRecipe();r.tests.splice(i,1);setCurrent(r);render()}
function saveRecipe(){let r=getRecipe();if(!r)return;if(!r.name.trim()){alert('레시피 이름을 먼저 입력해 주세요.');return}r.updated=new Date().toISOString().slice(0,10);if(!state.recipes.some(x=>x.id===r.id))state.recipes.unshift(r);draft=null;selected=r.id;save();render();alert('이 브라우저에 저장했어요. 정기적으로 백업 파일도 내려받아 주세요.')}
function deleteRecipe(){let r=getRecipe();if(!r)return;if(!confirm('이 레시피를 삭제할까요?'))return;state.recipes=state.recipes.filter(x=>x.id!==r.id);if(draft&&draft.id===r.id)draft=null;selected=null;save();render()}
function renderProduction(){let all=[...state.recipes];document.getElementById('main').innerHTML=`<div class="eyebrow">DAILY PRODUCTION</div><div class="pagehead"><div><h1>오늘의 생산</h1><div class="muted">오늘 만들 메뉴와 필요한 재료를 한 번에 계산해요.</div></div><button onclick="exportData()">백업 내보내기</button></div><div class="statrow"><div class="stat"><small>선택 메뉴</small><strong id="menuCount">0</strong></div><div class="stat"><small>총 생산 수량</small><strong id="totalCount">0</strong></div><div class="stat"><small>재료 종류</small><strong id="totalIngredients">0</strong></div></div><div class="panel"><h3>생산할 메뉴 선택</h3>${all.map(r=>`<div class="prodrow"><label><input type="checkbox" class="prodcheck" value="${r.id}" onchange="calcProduction()"> <b>${esc(r.name)}</b> <span class="muted">(${esc(r.category)})</span></label><input type="number" min="0" value="1" data-qty="${r.id}" onchange="calcProduction()"><span class="muted">배합 배수</span></div>`).join('')||'<div class="empty">먼저 레시피를 등록해 주세요.</div>'}</div><div class="panel"><div class="panelhead"><h3>필요 재료 합계</h3><button onclick="window.print()">인쇄하기</button></div><div id="productionTotals" class="empty">메뉴를 선택하면 필요한 재료가 여기에 표시돼요.</div></div><p class="footnote">※ 재료 합계는 각 레시피의 기준 배합량 × 배합 배수로 계산합니다.</p>`;calcProduction()}
function calcProduction(){let chosen=[...document.querySelectorAll('.prodcheck:checked')],sum={},qty=0;chosen.forEach(c=>{let r=state.recipes.find(x=>x.id===c.value);let mult=Math.max(0,Number(document.querySelector('[data-qty="'+c.value+'"]').value)||0);qty+=(r.baseYield||1)*mult;r.ingredients.forEach(i=>{let k=i.name.trim()||'(이름 없는 재료)';let key=k+'|'+(i.unit||'g');sum[key]=(sum[key]||0)+(Number(i.qty)||0)*mult})});let a=document.getElementById('menuCount');if(!a)return;document.getElementById('menuCount').textContent=chosen.length;document.getElementById('totalCount').textContent=fmt(qty);document.getElementById('totalIngredients').textContent=Object.keys(sum).length;document.getElementById('productionTotals').innerHTML=Object.keys(sum).length?'<div class="tablewrap"><table><thead><tr><th>재료명</th><th>필요량</th><th>단위</th></tr></thead><tbody>'+Object.entries(sum).map(([k,v])=>{let p=k.split('|');return '<tr><td>'+esc(p[0])+'</td><td class="qty">'+fmt(v)+'</td><td>'+esc(p[1])+'</td></tr>'}).join('')+'</tbody></table></div>':'선택한 메뉴가 없어요.'}
function renderIngredients(){document.getElementById('main').innerHTML=`<div class="eyebrow">PANTRY & COSTS</div><div class="pagehead"><div><h1>재료 관리</h1><div class="muted">재료 단가와 재고, 유통기한을 기록해요.</div></div><button class="primary" onclick="addStockItem()">＋ 재료 등록</button></div><div class="toolbar"><button onclick="exportData()">백업 내보내기</button><label><button onclick="document.getElementById('importFile').click()">백업 복원</button><input id="importFile" class="hidden" type="file" accept=".json,application/json" onchange="importData(event)"></label></div><div class="ingredientgrid">${state.ingredients.map((i,n)=>`<div class="ingredient"><div class="panelhead"><h4>${esc(i.name)}</h4><button class="danger" onclick="deleteStockItem(${n})">삭제</button></div><div class="row"><div class="field"><label>재고량 (${esc(i.unit)})</label><input type="number" value="${i.stock}" onchange="editStock(${n},'stock',this.value)"></div><div class="field"><label>단가 (원/${esc(i.unit)})</label><input type="number" value="${i.cost}" onchange="editStock(${n},'cost',this.value)"></div></div><div class="field"><label>유통기한</label><input type="date" value="${esc(i.expiry||'')}" onchange="editStock(${n},'expiry',this.value)"></div><div class="footnote">재고 금액 약 ${Math.round((Number(i.stock)||0)*(Number(i.cost)||0)).toLocaleString()}원</div></div>`).join('')||'<div class="empty">재료를 등록하면 재고와 단가를 관리할 수 있어요.</div>'}</div><p class="footnote" style="margin-top:18px">현재 재료 관리는 수동 기록 기능입니다. 레시피와 자동 연결하는 기능은 다음 개선 단계에서 추가할 수 있어요.</p>`}
function addStockItem(){let name=prompt('재료명');if(!name||!name.trim())return;state.ingredients.push({name:name.trim(),unit:'g',stock:0,cost:0,expiry:''});save();render()}
function editStock(n,k,v){state.ingredients[n][k]=['stock','cost'].includes(k)?Math.max(0,Number(v)||0):v;save();render()}
function deleteStockItem(n){if(confirm('이 재료 기록을 삭제할까요?')){state.ingredients.splice(n,1);save();render()}}
function exportData(){let blob=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),...state},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dangwadang-recipe-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let d=JSON.parse(rd.result);if(!Array.isArray(d.recipes)||!Array.isArray(d.ingredients))throw Error('형식');if(confirm('현재 저장된 자료를 백업 파일 내용으로 바꿀까요?')){state={recipes:d.recipes,ingredients:d.ingredients};save();render();alert('복원했어요.')}}catch(err){alert('올바른 당과당 백업 파일이 아니에요.')}e.target.value=''};rd.readAsText(f)}
render();
</script>
</body></html>
